<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cstyle%3E .beam %7B stroke: %236b6a64; %7D .verb %7B stroke: %23993c1d; fill: %23faece7; %7D .noun %7B stroke: %23185fa5; fill: %23e6f1fb; %7D @media (prefers-color-scheme: dark) %3E .beam %7B stroke: %23b4b2a9; %7D .verb %7B stroke: %23f0997b; fill: %234a1b0c; %7D .noun %7B stroke: %2385b7eb; fill: %23042c53; %7D %7D %3C/style%3E%3Cline class='beam' x1='2' y1='6' x2='30' y2='6' stroke-width='2' stroke-linecap='round'/%3E%3Cline class='verb' x1='11' y1='6' x2='6' y2='22' stroke-width='1.5' stroke-linecap='round'/%3E%3Ccircle class='verb' cx='6' cy='22' r='3.5' stroke-width='1'/%3E%3Cline class='noun' x1='21' y1='6' x2='26' y2='24' stroke-width='1.5' stroke-linecap='round'/%3E%3Ccircle class='noun' cx='26' cy='24' r='2.5' stroke-width='1'/%3E%3C/svg%3E">
<title>Unified Workspace: The Sovereign Substrate</title>
<style>
  :root {
    --bg: #ffffff;
    --bg-secondary: #f5f4f0;
    --bg-tertiary: #ebe9e3;
    --text-primary: #1a1a18;
    --text-secondary: #6b6a64;
    --text-tertiary: #9a9890;
    --border: rgba(0,0,0,0.12);
    --border-strong: rgba(0,0,0,0.22);
    --accent: #185fa5;
    --accent-bg: #e6f1fb;
    --verb: #993c1d;
    --verb-bg: #faece7;
    --noun: #185fa5;
    --noun-bg: #e6f1fb;
    --radius-md: 8px;
    --radius-lg: 12px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --font-serif: Georgia, "Times New Roman", serif;
    --font-mono: "SF Mono", Monaco, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1a;
      --bg-secondary: #262624;
      --bg-tertiary: #2e2e2b;
      --text-primary: #ece9e3;
      --text-secondary: #b4b2a9;
      --text-tertiary: #888780;
      --border: rgba(255,255,255,0.12);
      --border-strong: rgba(255,255,255,0.22);
      --accent: #85b7eb;
      --accent-bg: #0c447c;
      --verb: #f0997b;
      --verb-bg: #4a1b0c;
      --noun: #85b7eb;
      --noun-bg: #042c53;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 1.5rem;
    background: var(--bg-tertiary);
    color: var(--text-primary);
    font-family: var(--font-sans);
    display: flex;
    justify-content: center;
  }
  .wrap {
    max-width: 900px;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }
  h1 { font-size: 20px; font-weight: 500; margin: 0; }
  .subtitle { font-size: 13px; color: var(--text-secondary); margin: 0 0 0.5rem; }
  
  .grid-layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 1.25rem;
  }
  @media (min-width: 850px) {
    .grid-layout { grid-template-columns: 320px 1fr; }
  }

  .panel {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.85rem;
  }
  label { font-size: 12px; color: var(--text-secondary); font-weight: 600; display: block; }
  input[type="text"], select {
    width: 100%; font-size: 14px; padding: 8px 10px;
    border: 1px solid var(--border-strong); border-radius: var(--radius-md);
    background: var(--bg); color: var(--text-primary); font-family: var(--font-sans);
  }
  .row { display: flex; gap: 0.75rem; flex-wrap: wrap; align-items: center; }
  .control-group { flex: 1; min-width: 120px; }
  input[type="range"] { width: 100%; height: 4px; accent-color: var(--accent); }
  .val-display { font-size: 12px; font-family: var(--font-mono); float: right; color: var(--text-secondary); }
  
  button {
    background: var(--bg); border: 1px solid var(--border-strong); border-radius: var(--radius-md);
    padding: 8px 14px; font-size: 13px; color: var(--text-primary); cursor: pointer;
    display: flex; align-items: center; gap: 6px; font-family: var(--font-sans); transition: all 0.15s;
  }
  button:hover { background: var(--bg-secondary); }
  button.primary { background: var(--accent-bg); border-color: var(--accent); color: var(--accent); font-weight: 500; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .stage-panel {
    display: flex; flex-direction: column; gap: 1rem; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 1.25rem;
  }

  /* Staircase Styles */
  #lines { display: flex; flex-direction: column; gap: 8px; }
  .line {
    padding: 0.75rem 1rem; border: 1px solid var(--border); border-radius: var(--radius-md);
    background: var(--bg); overflow-wrap: break-word; transition: all 0.3s ease; position: relative; line-height: 1.5;
  }
  .line .index { font-size: 11px; color: var(--text-tertiary); margin-right: 10px; font-family: var(--font-mono); }
  .line .duration { position: absolute; top: 10px; right: 12px; font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono); }
  .line.active { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-bg); }
  .line.active .duration { color: var(--accent); }
  
  .breath-cue {
    position: absolute; top: 11px; right: 45px; width: 10px; height: 10px;
    border-radius: 50%; background: var(--accent); opacity: 0;
  }
  .line.active .breath-cue { opacity: 1; animation: pulse 4s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { transform: scale(0.8); opacity: 0.5; } 50% { transform: scale(1.4); opacity: 1; } }

  /* Pendulum Layout */
  svg { display: block; width: 100%; background: var(--bg); }
  .readout-bar {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-secondary);
    display: flex; gap: 14px; flex-wrap: wrap; padding-top: 0.5rem; border-top: 1px solid var(--border);
  }
  .readout-bar span strong { color: var(--text-primary); }

  .mode-indicator {
    display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; 
    font-weight: 600; text-transform: uppercase; font-family: var(--font-mono);
  }
  .mode-audio { background: #d4edda; color: #155724; }
  .mode-fallback { background: #fff3cd; color: #856404; }
  @media (prefers-color-scheme: dark) {
    .mode-audio { background: #1b4322; color: #d4edda; }
    .mode-fallback { background: #533f03; color: #fff3cd; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div>
    <h1>The Unified Substrate</h1>
    <p class="subtitle">An integrated container mapping speech variance to harmonic entrainment.</p>
  </div>

  <div class="grid-layout">
    <div class="panel">
      <div>
        <label for="sourceSelect">Audio Input Engine</label>
        <select id="sourceSelect" onchange="switchSource()">
          <option value="mic">Live Microphone Input</option>
          <option value="url">Preloaded Audio URL File</option>
          <option value="none">Manual / Timer Fallback Mode</option>
        </select>
      </div>

      <div id="urlInputGroup" style="display:none;">
        <label for="audioUrl">Audio Target Track URL</label>
        <input type="text" id="audioUrl" value="https://audio.patternfoundry.systems/hot/ThisIsWhatTheArchitectureOfMyNeedFeelsLike.wav" onchange="loadAudioTrack()">
      </div>

      <div>
        <label for="sentence">Cadence Script Text</label>
        <input type="text" id="sentence" value="This is what the architecture of my need feels like.">
      </div>

      <div class="row">
        <div class="control-group">
          <label>Iterations <span class="val-display" id="iterVal">4</span></label>
          <input type="range" id="iterations" min="2" max="8" step="1" value="4" oninput="rebuildStaircase()">
        </div>
      </div>

      <div class="row">
        <div class="control-group">
          <label>Base Span <span class="val-display" id="baseDurVal">4s</span></label>
          <input type="range" id="baseDur" min="2" max="10" step="1" value="4" oninput="rebuildStaircase()">
        </div>
        <div class="control-group">
          <label>Step Growth <span class="val-display" id="durStepVal">+2s</span></label>
          <input type="range" id="durStep" min="0" max="5" step="1" value="2" oninput="rebuildStaircase()">
        </div>
      </div>

      <div class="row">
        <div class="control-group">
          <label>Silence Floor <span class="val-display" id="floorVal">0.005</span></label>
          <input type="range" id="rmsFloor" min="0.001" max="0.03" step="0.001" value="0.005" oninput="updateFloorDisplay()">
        </div>
      </div>

      <div class="row" style="margin-top:0.5rem;">
        <button class="primary" id="actionBtn" onclick="toggleSystem()">
          <span id="btnIcon">&#9658;</span> <span id="btnLabel">Initialize</span>
        </button>
      </div>
      <div id="statusMessage" style="font-size:11px; color:var(--text-tertiary); font-family:var(--font-mono);">System uninitialized.</div>
    </div>

    <div class="stage-panel">
      <div id="lines"></div>

      <svg id="pvc" viewBox="0 0 560 260">
        <line id="beam" x1="40" y1="40" x2="520" y2="40" stroke="var(--text-secondary)" stroke-width="4" stroke-linecap="round"/>
        <line id="rod1" stroke="var(--verb)" stroke-width="2.5"/>
        <circle id="bob1" r="22" fill="var(--verb-bg)" stroke="var(--verb)" stroke-width="2"/>
        <text id="lbl1" text-anchor="middle" dominant-baseline="central" fill="var(--verb)" font-size="11" font-weight="600">Searching</text>
        <line id="rod2" stroke="var(--noun)" stroke-width="2.5"/>
        <circle id="bob2" r="15" fill="var(--noun-bg)" stroke="var(--noun)" stroke-width="2"/>
        <text id="lbl2" text-anchor="middle" dominant-baseline="central" fill="var(--noun)" font-size="11" font-weight="600">Canvas</text>
      </svg>

      <div class="readout-bar">
        <span>Engine: <span id="engineMode" class="mode-indicator mode-fallback">Off</span></span>
        <span>RMS Loudness: <strong id="rmsRead">0.000</strong></span>
        <span>Signal Coupling: <strong id="cplRead">0.10</strong></span>
        <span>Phase Gap: <strong id="phaseRead">0.0&deg;</strong></span>
        <span>State: <strong id="stateRead">Idle</strong></span>
      </div>
    </div>
  </div>
</div>

<script>
// --- Core System State Architecture ---
let activeMode = 'mic'; 
let initialized = false;
let running = false;

// Audio Node Map
let audioCtx = null;
let analyser = null;
let audioStream = null;
let audioBuffer = null;
let activeSources = [];

// Mathematical Constants & Windows
const HISTORY_LIMIT = 600;
const VAR_WINDOW = 35;
let recentRms = [];
let candidateSmoothed = 0.1;
const CANDIDATE_ALPHA = 0.04; 

// Physics State Engine (FIXED SCALING BASE)
const g = 0.00005; 
let damping = 0.0015;
let coupling = 0.1;
let theta1 = 0.8;  
let theta2 = -0.5;
let omega1 = 0;
let omega2 = 0;

const pivot1 = { x: 190, y: 40 };
const pivot2 = { x: 370, y: 40 };
const length1 = 150;
const length2 = 175;

let lastFrameTime = null;
let rafId = null;

// Staircase Tracking
let staircaseLines = [];
let sequenceTimerIds = [];
let fallbackProgressCoupling = 0.1;
let lineStartTimestamp = 0;
let currentLineDuration = 0;
let currentActiveLineIndex = -1;

const verbLexicon = ["Searching", "Examining", "Stretching"];
const nounLexicon = ["Canvas", "Space", "Air"];

// --- Setup Elements ---
function switchSource() {
  const src = document.getElementById('sourceSelect').value;
  activeMode = src;
  document.getElementById('urlInputGroup').style.display = (src === 'url') ? 'block' : 'none';
  shutdownAudioPipeline();
  updateStatusDisplay("Mode changed. Re-initialization required.");
}

function updateFloorDisplay() {
  document.getElementById('floorVal').textContent = document.getElementById('rmsFloor').value;
}

function updateStatusDisplay(msg, isErr=false) {
  const el = document.getElementById('statusMessage');
  el.textContent = msg;
  el.style.color = isErr ? '#c0392b' : 'var(--text-tertiary)';
}

// --- Structural Configuration Engine (The Staircase Builder) ---
function rebuildStaircase() {
  const text = document.getElementById('sentence').value || ' ';
  const iterations = parseInt(document.getElementById('iterations').value, 10);
  const baseDur = parseInt(document.getElementById('baseDur').value, 10);
  const durStep = parseInt(document.getElementById('durStep').value, 10);

  document.getElementById('iterVal').textContent = iterations;
  document.getElementById('baseDurVal').textContent = baseDur + 's';
  document.getElementById('durStepVal').textContent = '+' + durStep + 's';

  staircaseLines = [];
  const container = document.getElementById('lines');
  container.innerHTML = '';

  for (let i = 0; i < iterations; i++) {
    const spacing = i * 1.5; 
    const duration = baseDur + (durStep * i);
    staircaseLines.push({ text, letterSpacing: spacing, duration });

    const row = document.createElement('div');
    row.className = 'line';
    row.id = `sc-line-${i}`;
    row.style.letterSpacing = `${spacing}px`;
    row.style.opacity = Math.max(0.4, 1 - (i * 0.12));
    row.style.background = 'linear-gradient(to right, var(--accent-bg) 0%, var(--bg) 0%)';
    
    row.innerHTML = `<span class="index">${i+1}</span>${escapeHTML(text)}<span class="duration">${duration}s</span><div class="breath-cue"></div>`;
    container.appendChild(row);
  }
  syncPhysicsGraph();
}

function escapeHTML(str) {
  const p = document.createElement('p'); p.textContent = str; return p.innerHTML;
}

// --- Audio Core Pipelines ---
async function initializeAudioPipeline() {
  if (audioCtx && audioCtx.state === 'suspended') {
    await audioCtx.resume();
  }
  if (analyser) return true; 
  
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  
  if (activeMode === 'mic') {
    try {
      audioStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      const micSource = audioCtx.createMediaStreamSource(audioStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.1;
      micSource.connect(analyser);
      document.getElementById('engineMode').className = "mode-indicator mode-audio";
      document.getElementById('engineMode').textContent = "Microphone";
      return true;
    } catch (err) {
      updateStatusDisplay("Microphone access denied. Forcing manual mode.", true);
      document.getElementById('sourceSelect').value = 'none';
      activeMode = 'none';
      return false;
    }
  } else if (activeMode === 'url') {
    return await loadAudioTrack();
  }
  return true;
}

async function loadAudioTrack() {
  const url = document.getElementById('audioUrl').value.trim();
  if (!url) return false;
  updateStatusDisplay("Fetching target audio asset...");
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    
    const res = await fetch(url);
    const bufferData = await res.arrayBuffer();
    audioBuffer = await audioCtx.decodeAudioData(bufferData);
    
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.1;
    
    document.getElementById('engineMode').className = "mode-indicator mode-audio";
    document.getElementById('engineMode').textContent = "Buffer Stream";
    updateStatusDisplay("Audio asset decoded into memory substrate.");
    return true;
  } catch (err) {
    updateStatusDisplay(`Network audio fault: ${err.message}`, true);
    return false;
  }
}

// ANCHOR MODIFICATION: Path 1 Native Speed Trigger Implementation
function playNativeSentence() {
  if (!audioCtx || !audioBuffer || !analyser) return;

  const source = audioCtx.createBufferSource();
  source.buffer = audioBuffer;

  // Enforce absolute un-stretched playback speed (1.0) to hold your natural voice print
  source.playbackRate.value = 1.0;

  source.connect(analyser);
  analyser.connect(audioCtx.destination);
  
  source.start(0);
  activeSources.push(source);
}

function shutdownAudioPipeline() {
  stopScaffoldingTimers();
  if (audioStream) {
    audioStream.getTracks().forEach(track => track.stop());
    audioStream = null;
  }
  if (audioCtx) {
    audioCtx.close().catch(() => {});
    audioCtx = null;
  }
  analyser = null;
  audioBuffer = null;
  document.getElementById('engineMode').className = "mode-indicator mode-fallback";
  document.getElementById('engineMode').textContent = "Off";
}

// --- Execution Loop Control ---
async function toggleSystem() {
  const btn = document.getElementById('actionBtn');
  if (!running) {
    updateStatusDisplay("Spinning up execution substrate...");
    const success = await initializeAudioPipeline();
    if (!success) { activeMode = 'none'; }
    
    running = true;
    btn.classList.add('primary');
    document.getElementById('btnIcon').innerHTML = "&#9646;&#9646;";
    document.getElementById('btnLabel').textContent = "Pause Substrate";
    updateStatusDisplay("Substrate online and processing.");
    
    lastFrameTime = null;
    executeScriptSequence();
    rafId = requestAnimationFrame(systemLoop);
  } else {
    running = false;
    btn.classList.remove('primary');
    document.getElementById('btnIcon').innerHTML = "&#9658;";
    document.getElementById('btnLabel').textContent = "Breathe";
    stopScaffoldingTimers();
    updateStatusDisplay("Substrate suspended.");
  }
}

// --- Visual & Audio Processing Execution Loop ---
const frequencyData = new Uint8Array(256);

function runVarianceAnalysis() {
  if (!analyser || activeMode === 'none') return null;
  analyser.getByteTimeDomainData(frequencyData);
  
  let sumSq = 0;
  for (let i = 0; i < frequencyData.length; i++) {
    const norm = (frequencyData[i] - 128) / 128;
    sumSq += norm * norm;
  }
  const currentRms = Math.sqrt(sumSq / frequencyData.length);
  document.getElementById('rmsRead').textContent = currentRms.toFixed(4);

  const floorThreshold = parseFloat(document.getElementById('rmsFloor').value);

  if (currentRms < floorThreshold) {
    document.getElementById('stateRead').textContent = "Silence (Frozen)";
    return coupling / 0.6; 
  }

  document.getElementById('stateRead').textContent = "Processing Signal";
  recentRms.push(currentRms);
  if (recentRms.length > VAR_WINDOW) recentRms.shift();

  const mean = recentRms.reduce((a, b) => a + b, 0) / recentRms.length;
  const variance = recentRms.reduce((a, b) => a + (b - mean) * (b - mean), 0) / recentRms.length;

  const normalVariance = Math.min(1, variance / 0.0015); 
  return 1 - normalVariance; 
}

function systemLoop(timestamp) {
  if (!running) return;
  
  if (lastFrameTime === null) lastFrameTime = timestamp;
  let dt = timestamp - lastFrameTime;
  lastFrameTime = timestamp;

  if (dt > 100 || dt <= 0) {
    dt = 16.66; 
  }

  if (currentActiveLineIndex !== -1) {
    const elapsedLineTime = timestamp - lineStartTimestamp;
    const progressPercent = Math.min(100, (elapsedLineTime / (currentLineDuration * 1000)) * 100);
    const activeEl = document.getElementById(`sc-line-${currentActiveLineIndex}`);
    if (activeEl) {
      activeEl.style.background = `linear-gradient(to right, var(--accent-bg) ${progressPercent}%, var(--bg) ${progressPercent}%)`;
    }
  }

  let targetCouplingSignal = 0;
  if (activeMode !== 'none' && analyser) {
    targetCouplingSignal = runVarianceAnalysis();
  } else {
    document.getElementById('stateRead').textContent = "Fallback Step Engine";
    document.getElementById('rmsRead').textContent = "0.0000";
    targetCouplingSignal = fallbackProgressCoupling;
  }

  if (isNaN(targetCouplingSignal) || targetCouplingSignal === null) {
    targetCouplingSignal = 0.1;
  }

  candidateSmoothed = candidateSmoothed + (targetCouplingSignal - candidateSmoothed) * CANDIDATE_ALPHA;
  coupling = Math.max(0.01, Math.min(0.6, candidateSmoothed * 0.6));
  document.getElementById('cplRead').textContent = coupling.toFixed(3);

  const subSteps = 4;
  const fixedSubDt = dt / subSteps;

  for (let step = 0; step < subSteps; step++) {
    if (isNaN(theta1) || isNaN(theta2) || isNaN(omega1) || isNaN(omega2)) {
      theta1 = 0.8; theta2 = -0.5;
      omega1 = 0; omega2 = 0;
      break;
    }

    const a1 = -g * Math.sin(theta1) / length1 - damping * omega1 + coupling * (theta2 - theta1);
    const a2 = -g * Math.sin(theta2) / length2 - damping * omega2 + coupling * (theta1 - theta2);
    
    omega1 += a1 * fixedSubDt; 
    omega2 += a2 * fixedSubDt;
    theta1 += omega1 * fixedSubDt; 
    theta2 += omega2 * fixedSubDt;
  }

  if (isNaN(theta1) || isNaN(theta2) || isNaN(omega1) || isNaN(omega2)) {
    theta1 = 0.8;
    theta2 = -0.5;
    omega1 = 0;
    omega2 = 0;
  }

  syncPhysicsGraph();
  rafId = requestAnimationFrame(systemLoop);
}

function syncPhysicsGraph() {
  const p1 = { x: pivot1.x + length1 * Math.sin(theta1), y: pivot1.y + length1 * Math.cos(theta1) };
  const p2 = { x: pivot2.x + length2 * Math.sin(theta2), y: pivot2.y + length2 * Math.cos(theta2) };

  document.getElementById('rod1').setAttribute('x1', pivot1.x);
  document.getElementById('rod1').setAttribute('y1', pivot1.y);
  document.getElementById('rod1').setAttribute('x2', p1.x);
  document.getElementById('rod1').setAttribute('y2', p1.y);

  document.getElementById('rod2').setAttribute('x1', pivot2.x);
  document.getElementById('rod2').setAttribute('y1', pivot2.y);
  document.getElementById('rod2').setAttribute('x2', p2.x);
  document.getElementById('rod2').setAttribute('y2', p2.y);

  document.getElementById('bob1').setAttribute('cx', p1.x);
  document.getElementById('bob1').setAttribute('cy', p1.y);
  document.getElementById('bob2').setAttribute('cx', p2.x);
  document.getElementById('bob2').setAttribute('cy', p2.y);

  document.getElementById('lbl1').setAttribute('x', p1.x);
  document.getElementById('lbl1').setAttribute('y', p1.y);
  document.getElementById('lbl2').setAttribute('x', p2.x);
  document.getElementById('lbl2').setAttribute('y', p2.y);

  let delta = Math.abs(theta1 - theta2) % (Math.PI * 2);
  if (delta > Math.PI) delta = Math.PI * 2 - delta;
  const degGap = delta * (180 / Math.PI);
  document.getElementById('phaseRead').innerHTML = degGap.toFixed(1) + "&deg;";

  const layerIndex = Math.min(2, Math.floor((1 - Math.min(degGap, 60) / 60) * 3));
  document.getElementById('lbl1').textContent = verbLexicon[layerIndex];
  document.getElementById('lbl2').textContent = nounLexicon[layerIndex];
}

// --- Script Scaffolding Sequencer ---
function executeScriptSequence() {
  stopScaffoldingTimers();
  let cumulativeTimeline = 0;

  document.querySelectorAll('.line').forEach(el => {
    el.style.background = 'linear-gradient(to right, var(--accent-bg) 0%, var(--bg) 0%)';
  });

  staircaseLines.forEach((line, index) => {
    const enterDelay = cumulativeTimeline * 1000;
    sequenceTimerIds.push(setTimeout(() => {
      document.querySelectorAll('.line').forEach((el, i) => {
        el.classList.toggle('active', i === index);
        if (i !== index) {
          el.style.background = 'linear-gradient(to right, var(--accent-bg) 0%, var(--bg) 0%)';
        }
      });

      currentActiveLineIndex = index;
      currentLineDuration = line.duration;
      lineStartTimestamp = performance.now();

      // Native audio trigger invocation replacing old speed factors
      if (activeMode === 'url' && audioBuffer) {
        activeSources.forEach(s => { try { s.stop(); } catch(e){} });
        activeSources = [];
        playNativeSentence();
      }

      if (activeMode === 'none') {
        fallbackProgressCoupling = 0.1 + (0.9 * (index / (staircaseLines.length - 1)));
      }
    }, enterDelay));

    cumulativeTimeline += line.duration;
  });

  const finalSequenceDuration = cumulativeTimeline * 1000;
  sequenceTimerIds.push(setTimeout(() => {
    document.querySelectorAll('.line').forEach(el => {
      el.classList.remove('active');
      el.style.background = 'linear-gradient(to right, var(--accent-bg) 0%, var(--bg) 0%)';
    });
    currentActiveLineIndex = -1;
    if (activeMode === 'none') fallbackProgressCoupling = 0.1; 
  }, finalSequenceDuration));

  sequenceTimerIds.push(setTimeout(() => {
    if (running) executeScriptSequence();
  }, finalSequenceDuration + 2000));
}

function stopScaffoldingTimers() {
  sequenceTimerIds.forEach(id => clearTimeout(id));
  sequenceTimerIds = [];
  currentActiveLineIndex = -1;
  activeSources.forEach(s => { try { s.stop(); } catch(e){} });
  activeSources = [];
}

document.getElementById('sentence').addEventListener('input', rebuildStaircase);
window.addEventListener('DOMContentLoaded', () => {
  rebuildStaircase();
  updateFloorDisplay();
});
</script>
</body>
</html>
